[package]
name = "neutronstar-rust-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
